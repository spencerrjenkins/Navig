# NAVIG conda environment specification
#
# Usage:
#   conda env create -f environment.yml
#   conda activate navig
#
# NOTE: PyTorch is installed via the PyTorch pip index (not PyPI).
# conda env create handles this correctly via the pip: section below.
#
# After creating the environment, build GroundingDINO from local source:
#   module load gcc/11.2.0 cuda/12.1.1
#   export CUDA_HOME=/opt/common/cuda/cuda-12.1.1
#   export TORCH_CUDA_ARCH_LIST="8.6"
#   pip install --no-build-isolation -e GroundingDINO/
#
# This targets the RTX A6000 (SM 8.6). For other GPUs, adjust TORCH_CUDA_ARCH_LIST.

name: navig
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip

  # faiss-gpu from conda-forge avoids rebuilding from source
  - faiss-gpu

  - pip:
    # PyTorch 2.4.0 with CUDA 12.1 — must come from the PyTorch wheel index
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.4.0+cu121
    - torchvision==0.19.0+cu121
    - torchaudio==2.4.0+cu121

    # Core ML / vision
    - transformers==4.45.2
    - accelerate==1.0.1
    - peft==0.12.0
    - einops==0.8.0
    - timm==1.0.9
    - sentencepiece==0.2.0

    # ms-Swift: model loading + LoRA adapters for LLaVA/Qwen/CPM
    - ms-swift==2.5.0.post1
    # qwen-vl-utils 0.0.14 removed IMAGE_FACTOR/MIN_PIXELS/MAX_PIXELS — pin to 0.0.9
    - qwen-vl-utils==0.0.9

    # CLIP (OpenAI) — installed from source; PyPI package is a placeholder
    - git+https://github.com/openai/CLIP.git

    # pyairports — PyPI 0.0.1 is a squatter; install the real one from GitHub
    - git+https://github.com/NICTA/pyairports.git

    # vLLM batch inference acceleration for stages 4–6
    # 0.5.5 is the minimum version supporting LlavaNextForConditionalGeneration
    - vllm==0.5.5
    - ninja

    # Utilities
    - Pillow==10.4.0
    - opencv-python==4.10.0.84
    - numpy<2.0
    - requests==2.32.3
    - tqdm==4.66.5
    - retry==0.9.2
    - openai==1.46.0
    - rouge-score==0.1.2

    # Plotting (used by figures/)
    - matplotlib
    - seaborn
